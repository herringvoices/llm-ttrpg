[package]
name = "llm-ttrpg-desktop"
version = "0.1.0"
description = "Desktop host for the LLM TTRPG reference game"
edition = "2021"

[lib]
name = "llm_ttrpg_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }

